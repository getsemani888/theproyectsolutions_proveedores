<!DOCTYPE html>
<html>
    <head>
        <title>TheProjectSolutions - Consulta de Proveedores</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
            .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
            h1 { color: #27ae60; text-align: center; }
            label { display: block; margin-top: 15px; font-weight: bold; color: #34495e; }
            input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
            input[type="submit"] { margin-top: 20px; background-color: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
            input[type="submit"]:hover { background-color: #219150; }
            .link { text-align: center; margin-top: 20px; }
            .info { background-color: #ecf0f1; padding: 10px; border-radius: 5px; font-size: 13px; color: #7f8c8d; margin-top: 15px; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Consulta de Proveedores</h1>
            <p style="text-align:center; color:#7f8c8d;">TheProjectSolutions</p>
            
            <form action="ServletProveedor" method="GET">
                <label for="nit">Buscar por NIT:</label>
                <input type="text" id="nit" name="nit" required>
                
                <input type="submit" value="Consultar Proveedor">
            </form>
            
            <div class="info">
                💡 Este formulario usa el método <strong>GET</strong>. Observa cómo los datos aparecen en la URL al enviar.
            </div>
            
            <div class="link">
                <a href="index.html">Volver al formulario de registro (POST)</a>
            </div>
        </div>
    </body>
</html>
