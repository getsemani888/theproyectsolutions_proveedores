
<!DOCTYPE html>
<html>
    <head>
        <title>TheProjectSolutions - Registro de Proveedores</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
            .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
            h1 { color: #2c3e50; text-align: center; }
            label { display: block; margin-top: 15px; font-weight: bold; color: #34495e; }
            input[type="text"], input[type="email"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
            input[type="submit"] { margin-top: 20px; background-color: #3498db; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
            input[type="submit"]:hover { background-color: #2980b9; }
            .link { text-align: center; margin-top: 20px; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Registro de Proveedores</h1>
            <p style="text-align:center; color:#7f8c8d;">TheProjectSolutions</p>
            
            <form action="ServletProveedor" method="POST">
                <label for="nit">NIT:</label>
                <input type="text" id="nit" name="nit" required>
                
                <label for="razonSocial">Razón Social:</label>
                <input type="text" id="razonSocial" name="razonSocial" required>
                
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required>
                
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required>
                
                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad" required>
                
                <input type="submit" value="Registrar Proveedor">
            </form>
            
            <div class="link">
                <a href="consulta.html">Ir al formulario de consulta (GET)</a>
            </div>
        </div>
    </body>
</html>
